name: sello
description: B2B Sales Order Management for wholesalers and distributors.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  supabase_flutter: ^2.16.0
  google_fonts: ^6.2.1
  flutter_web_plugins:
    sdk: flutter
  equatable: ^2.0.7
  image_picker: ^1.1.2
  intl: ^0.20.2
  image: ^4.9.1
  crop_your_image: ^2.0.0
  http: ^1.2.2
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.6.0
  lottie: ^3.5.1
  web: ^1.1.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#4237E7"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/animations/location_route.json
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-Bold.ttf
          weight: 700
