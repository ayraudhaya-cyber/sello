<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sello — sales order management for wholesalers and distributors.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sello">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sello</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6C4FF2">
</head>
<body>
  <!--
    Public invoices (/d/…) opened on iPhone skip the Flutter canvas engine.
    Safari’s advanced privacy protection blocks that engine and leaves a
    blank page with “Reduce Protections”. Every other route still boots Flutter.
  -->
  <script>
    (function () {
      var path = location.pathname || "/";
      var isDocument = path === "/d" || path.indexOf("/d/") === 0;
      var apple =
        /iPhone|iPad|iPod/.test(navigator.userAgent || "") ||
        (navigator.platform === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);

      function loadFlutter() {
        var pwa = document.createElement("script");
        pwa.src = "pwa_install.js";
        document.body.appendChild(pwa);
        var boot = document.createElement("script");
        boot.src = "flutter_bootstrap.js";
        boot.async = true;
        document.body.appendChild(boot);
      }

      if (!isDocument || !apple) {
        loadFlutter();
        return;
      }

      var config = document.createElement("script");
      config.src = "supabase_public.js";
      config.onload = function () {
        var pub = window.selloPublic || {};
        if (!pub.url || !pub.key) {
          loadFlutter();
          return;
        }
        var view = document.createElement("script");
        view.src = "document_view.js";
        document.body.appendChild(view);
      };
      config.onerror = loadFlutter;
      document.body.appendChild(config);
    })();
  </script>
</body>
</html>
