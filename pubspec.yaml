name: sello
description: B2B Sales Order Management for wholesalers and distributors.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  supabase_flutter: ^2.16.0
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#4237E7"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/brand/
